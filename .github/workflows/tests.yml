name: Execute tests

on: [push]

jobs:
  code-style:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        laravel:
          - 10.*
          - 11.*
          - 12.*
          - 13.*
        dependency-version:
          - prefer-lowest
          - prefer-stable
        exclude:
          - php: 8.1
            laravel: 12.*
          - php: 8.1
            laravel: 13.*
          - php: 8.2
            laravel: 13.*

    name: Tests P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install
        run: composer install --prefer-dist --no-interaction

      - name: Code style checks for PHP
        run: composer test
